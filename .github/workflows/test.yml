name: "build-test-dev"
on:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - "*.md"
  push:
    branches:
      - dev
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - windows-2025-vs2026
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup MSBuild (vswhere-path)
        id: setup_msbuild_explicit
        uses: ./
        with:
          vswhere-path: C:\ProgramData\chocolatey\bin

      - name: Setup MSBuild (PATH)
        id: setup_msbuild_path
        uses: ./

      - name: Setup MSBuild (fallback)
        id: setup_msbuild_fallback
        uses: ./
        env:
          PATH: ""

      - name: Setup MSBuild (x64)
        if: runner.arch == 'X64'
        id: setup_msbuild_path_x64
        uses: ./
        with:
          vs-prerelease: true
          msbuild-architecture: "x64"

      - name: Setup MSBuild (arm64)
        if: runner.arch == 'ARM64'
        id: setup_msbuild_path_arm64
        uses: ./
        with:
          vs-prerelease: true
          msbuild-architecture: "arm64"

      - name: Write MSBuild summary
        if: always()
        shell: pwsh
        env:
          MATRIX_RUNNER: ${{ matrix.runner }}
          RUNNER_ARCH: ${{ runner.arch }}
          MSBUILD_PATH_EXPLICIT: ${{ steps.setup_msbuild_explicit.outputs.msbuildPath || 'N/A' }}
          MSBUILD_PATH_PATH: ${{ steps.setup_msbuild_path.outputs.msbuildPath || 'N/A' }}
          MSBUILD_PATH_FALLBACK: ${{ steps.setup_msbuild_fallback.outputs.msbuildPath || 'N/A' }}
          MSBUILD_PATH_X64: ${{ steps.setup_msbuild_path_x64.outputs.msbuildPath || 'N/A' }}
          MSBUILD_PATH_ARM64: ${{ steps.setup_msbuild_path_arm64.outputs.msbuildPath || 'N/A' }}
        run: |
          @"
          ## MSBuild setup summary

          - Runner label: `$env:MATRIX_RUNNER`
          - Runner architecture: `$env:RUNNER_ARCH`

          | Probe | msbuildPath |
          | --- | --- |
          | vswhere-path | $env:MSBUILD_PATH_EXPLICIT |
          | PATH | $env:MSBUILD_PATH_PATH |
          | Fallback | $env:MSBUILD_PATH_FALLBACK |
          | x64 | $env:MSBUILD_PATH_X64 |
          | arm64 | $env:MSBUILD_PATH_ARM64 |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: echo MSBuild
        run: msbuild -version
