name: "build-test-dev"
on:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - '*.md'
  push:
    branches:
      - dev
    paths-ignore:
      - '*.md'

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

    - name: Setup MSBuild (vswhere-path)
      id: setup_msbuild_explicit
      uses: ./
      with:
        vswhere-path: C:\ProgramData\chocolatey\bin

    - name: Setup MSBuild (PATH)
      id: setup_msbuild_path
      uses: ./

    - name: Setup MSBuild (fallback)
      id: setup_msbuild_fallback
      uses: ./
      env:
        PATH: ''

    - name: echo msbuild path
      env:
        MSBUILD_PATH_EXPLICIT: ${{ steps.setup_msbuild_explicit.outputs.msbuildPath }}
        MSBUILD_PATH_PATH: ${{ steps.setup_msbuild_path.outputs.msbuildPath }}
        MSBUILD_PATH_FALLBACK: ${{ steps.setup_msbuild_fallback.outputs.msbuildPath }}
      run: |
        echo "vswhere-path: $MSBUILD_PATH_EXPLICIT"
        echo "PATH: $MSBUILD_PATH_PATH"
        echo "Fallback: $MSBUILD_PATH_FALLBACK"

    - name: echo MSBuild
      run: msbuild -version
