name: Test vs-version input (Linux - expected failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          vs-version: '16.0'

      - name: Assert action fails on Linux with Windows-only message
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on Linux runner even with vs-version set, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly reported failure on non-Windows runner with vs-version input"
