name: Test setup-msbuild with pre-release VS enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          vs-prerelease: "true"
        continue-on-error: true
      - name: Assert action ran with prerelease flag or failed gracefully on Linux
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MSBUILD_PATH: ${{ steps.action.outputs.msbuildPath }}
        run: |
          echo "outcome: $OUTCOME"
          echo "msbuildPath: $MSBUILD_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MSBUILD_PATH" ]; then
              echo "FAIL: action succeeded but msbuildPath output is empty"
              exit 1
            fi
            echo "PASS: msbuildPath='$MSBUILD_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (MSBuild/Visual Studio not available on Linux)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
